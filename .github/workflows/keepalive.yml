# Supabase pauses free projects after 7 days without activity (docs/free_tier.md); its Storage serves the
# figure images (D54), so ping its Postgres weekly. Neon does not pause projects.
name: keepalive
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -c "select 1"
